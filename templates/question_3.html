<!doctype html>
<html lang="en">
<head>
    <title> Eco-Trivia</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div class="barra-superior"></div>
<!-- Respuestas posibles -->
    <h2>Si tienes un vaso reutilizable, ¿qué determina principalmente si resulta ambientalmente ventajoso?</h2>
    <h3 id="C" class="C" style="display: none;"> Correcto</h3>
    <h3 id="B" class="B" style="display: none;"> Incorrecto</h3>
    <button onclick="B_Ans()">Que sea de color verde</button>
    <button onclick="C_Ans()">Cuántas veces se reutiliza y cómo fue fabricado</button>
    <button onclick="B_Ans()">Que tenga un símbolo de reciclaje</button>
    <p id="explicacion" style="display: none;">La verdadera forma de que un objeto sea realmente ecologico se nescesita que sea durarero y que compensé su costo de produción</p>
    <button id="sig" class="sig" disabled onclick="setTimeout(() => window.location.href='/question_4', 300)">siguiente</button>
    <p></p>
    <div class="barra-inferior"></div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<script>
    let Pts = Number(sessionStorage.getItem("Pts")) || 0;
    let Ans = false;
    //Funciones que muestran la respuesta correcta y su expluicación, ademas del botón de siguiente
    function C_Ans()
    {
        if (!Ans){
            Ans = true;
            const G_A = new Howl
            ({
        
                src: ["/static/G_Anwser.wav"]
            })
            G_A.play()
            document.getElementById("sig").disabled = false;
            document.getElementById("explicacion").style.display = "block";
            document.getElementById("C").style.display = "block";
            Pts = Pts +1;
        sessionStorage.setItem("Pts", Pts)   
        console.log(Pts);
        }

    }
    function B_Ans()
    {
        if (!Ans)
        {
            const W_A = new Howl
            ({
        
                src: ["/static/W_Anwser.wav"]
            })
            W_A.play()
            Ans=true
            document.getElementById("sig").disabled = false;
            document.getElementById("explicacion").style.display = "block";
            document.getElementById("B").style.display = "block";
            sessionStorage.setItem("Pts", Pts)   
            console.log(Pts);
        }
    }
</script>
